<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opintotehtävät N26</title>
<style>
:root{
  --bg:#f5f4f0;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;
  --accent:#b3261e;--accent-ink:#fff;--warn:#c76a00;--ok:#2e7d32;--info:#1f5fa8;
  --s-annettu:#8a8780;--s-aloitettu:#1f5fa8;--s-valmis:#7a5c00;--s-palautettu:#2e7d32;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161615;--card:#22211f;--ink:#efeee9;--muted:#a3a19a;--line:#36352f;
  --accent:#e0574e;--warn:#f0a040;--ok:#6cc070;--info:#7fb0ef;
  --s-annettu:#a3a19a;--s-aloitettu:#7fb0ef;--s-valmis:#e6c25a;--s-palautettu:#6cc070;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
nav{display:flex;gap:4px;padding:0 10px 8px;max-width:760px;margin:0 auto}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 6px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{width:100%;resize:vertical;min-height:38px}
.bar input[type=search]{flex:1;min-width:140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;opacity:.7;margin-left:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;margin-bottom:10px;border-left:4px solid var(--line)}
.card.late{border-left-color:var(--accent);background:var(--accent);color:#fff}
.card.late .title,.card.late .cname,.card.late .info,.card.late .when,.card.late .when b,.card.late .muted,.card.late summary,.card.late .mine label{color:#fff!important}
.card.late a{color:#fff}.card.late .code{background:#fff;color:var(--accent)}.card.late .type{color:#fff;border-color:#fff}
.card.late .btn.ghost{color:#fff}.card.late .seg{border-color:rgba(255,255,255,.6);background:var(--card)}
.card.urgent{border-left-color:var(--accent)}
.urgent .when b{color:var(--accent)}
.card.soon{border-left-color:var(--warn)}
.card.done{opacity:.62}
.row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.code{font-weight:700;font-size:12px;letter-spacing:.03em;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:6px}
.type{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
.type.tentti{color:var(--accent);border-color:var(--accent)}
.type.priv{color:var(--info);border-color:var(--info)}
.type.aud{color:var(--ink);border-color:var(--ink);font-weight:700}
.when{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.when b{color:var(--ink)}
.late .when b{color:var(--accent)} .soon .when b{color:var(--warn)}
.title{font-weight:600;font-size:15.5px;margin:2px 0}
.cname{font-size:12.5px;color:var(--muted)}
.info{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.links{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
a{color:var(--info)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:13.5px;border-radius:9px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:7px 6px}
.btn.in{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:9px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:7px 2px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on[data-s=Annettu]{background:var(--s-annettu);color:#fff}
.seg button.on[data-s=Aloitettu]{background:var(--s-aloitettu);color:#fff}
.seg button.on[data-s=Valmis]{background:var(--s-valmis);color:#fff}
.seg button.on[data-s=Palautettu]{background:var(--s-palautettu);color:#fff}
details.more{margin-top:8px}
details.more summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.mine{display:grid;gap:8px;margin-top:8px}
.mine label{font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty p{margin:0 0 14px}
.notice{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:14px}
.notice.warn{border-color:var(--warn)}
.notice .btn{margin-top:8px}
.group{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 6px}
.fab{position:fixed;right:16px;bottom:18px;z-index:6;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:13px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px}
@media(min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 12px;font-size:17px}
.form{display:grid;gap:11px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.form select,.form input,.form textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.check{display:flex!important;align-items:center;gap:8px;font-weight:500!important;color:var(--ink)!important}
.check input{width:auto}
.dup{font-size:13px;color:var(--warn)}
.err{font-size:13px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
</style>
<style>
.hhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 8px;font-size:15px}
table.tight{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13.5px}
table.tight th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line)}
table.tight td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.tight tr:last-child td{border-bottom:0}
table.tight tr.band td{padding:10px 6px 3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);background:transparent;cursor:default}
table.tight tr.band:not(:first-child) td{border-top:1px solid var(--line)}
table.tight tbody tr{cursor:pointer}
table.tight td.ttl{white-space:normal;width:100%;line-height:1.25}
table.tight td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.tight tr.late td{background:var(--accent);color:#fff;font-weight:600}
table.tight tr.late .code{background:#fff;color:var(--accent)}table.tight tr.late .tentti{color:#fff}
table.tight tr.urgent td.num,table.tight tr.urgent td:first-child{color:var(--accent)}
table.tight tr.soon td.num,table.tight tr.soon td:first-child{color:var(--warn)}
table.tight .code{font-size:11px;padding:1px 5px}
table.tight .tentti{color:var(--accent);font-weight:600;font-size:12px}
.pill{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;color:#fff;background:var(--s-annettu)}
.pill[data-s=Aloitettu]{background:var(--s-aloitettu)}.pill[data-s=Valmis]{background:var(--s-valmis)}
.login{max-width:380px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.login h2{margin:0 0 6px;font-size:19px}
.login p{color:var(--muted);font-size:14px;margin:0 0 14px}
.login input{width:100%;margin-bottom:10px}
.login .btn{width:100%;padding:10px}
.foot{text-align:center;margin:24px 0 0;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--info);font:inherit;cursor:pointer;text-decoration:underline;padding:0 4px}
.by{font-size:12px;color:var(--muted);margin-top:4px}
table.adm{width:100%;border-collapse:collapse;font-size:14px}
table.adm td{padding:8px 4px;border-bottom:1px solid var(--line)}
.sheet .txt{font-size:14.5px;line-height:1.5}
.sheet .txt li{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Opintotehtävät <span>N26</span></h1><span id="status" class="muted"></span></div>
  <nav id="nav" class="hidden">
    <button data-view="etusivu" class="on">Etusivu</button>
    <button data-view="kori">Oma kori</button>
    <button data-view="kaikki">Kaikki</button>
    <button data-view="admin" class="hidden" id="navAdmin">Ylläpito</button>
  </nav>
</header>
<main id="main"><div class="empty">Ladataan…</div></main>
<button class="fab hidden" id="fab">+ Lisää tehtävä</button>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const STATUSES = ["Annettu","Aloitettu","Valmis","Palautettu"];
const EXAM_STATUSES = ["Annettu","Palautettu"];
const TYPES = ["Yksilö","Ryhmä","Tentti"];
const statusesFor = t => t && t.type==="Tentti" ? EXAM_STATUSES : STATUSES;
const statusLabel = (s,t) => t && t.type==="Tentti" ? ({Annettu:"Tulossa",Palautettu:"Tehty"}[s]||s) : s;
function normStatus(s,t){ if(!s) s="Annettu"; if(t && t.type==="Tentti"){ if(s==="Valmis") s="Palautettu"; else if(s==="Aloitettu") s="Annettu"; } return s; }
const isFinished = (s,t) => normStatus(s,t)==="Palautettu";
const BASE = location.origin + location.pathname;

const S = { token:null, me:null, view:"etusivu", courses:[], tasks:new Map(), mine:new Map(), members:[],
  loaded:false, invalid:false, newLink:null, f:{ koriStatus:"aktiiviset", course:"", q:"", showPast:false, list:"minulle" } };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }
function daysLeft(dl){ if(!dl) return null; const [y,m,d]=dl.split("-").map(Number); const t=new Date(); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/86400000); }
function fmtDate(dl){ if(!dl) return "ei DL:ää"; const [y,m,d]=dl.split("-"); const wd=["su","ma","ti","ke","to","pe","la"][new Date(+y,+m-1,+d).getDay()]; return `${wd} ${+d}.${+m}.${y!==String(new Date().getFullYear())?y:""}`; }
const courseName = code => (S.courses.find(c=>c.code===code)||{}).name || "";
const effDl = (t,m) => (m && m.my_dl) || t.dl || "";
const urg = d => d<0 ? "late" : d<3 ? "urgent" : d<7 ? "soon" : "";
const AUD = [["","Kaikki"],["P","Pelastajat (P)"],["AP","Alipäällystö (AP)"],["P,AP","Pelastajat + alipäällystö (P+AP)"]];
const audKey = t => (t.audience||[]).slice().sort((a,b)=>a==="P"?-1:1).join(",");
const audBadge = t => { const k=audKey(t); return k ? `<span class="type aud">${k.replace(",","+")}</span>` : ""; };
const visibleMine = id => { const m=S.mine.get(id); return m && !m.hidden ? m : null; };
const isPast = t => { const d=daysLeft(t.dl); return d!==null && d<0; };
const linkFor = tok => BASE + "#k=" + tok;

/* ---------- token ---------- */
function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(_){} }
function readStore(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
(function grabToken(){
  const m = location.hash.match(/k=([a-f0-9]{32,})/i);
  if(m){ S.token=m[1]; store("amkn26_token",S.token); history.replaceState(null,"",BASE); }
  else S.token = readStore("amkn26_token");
})();

/* ---------- api ---------- */
async function rpc(fn, args={}){
  const r = await fetch(`${APP_CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:"POST",
    headers:{ "apikey":APP_CONFIG.SUPABASE_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(fn==="app_login" ? args : { p_token:S.token, ...args }) });
  const txt = await r.text(); let data=null; try{ data = txt ? JSON.parse(txt) : null; }catch(_){ data=txt; }
  if(!r.ok){ const e=new Error((data&&data.message)||"Virhe"); e.code=data&&data.code; throw e; }
  return data;
}
async function loadAll(){
  if(!S.token){ render(); return; }
  try{
    const st = await rpc("app_state");
    S.me=st.me; S.courses=st.courses||[]; S.tasks=new Map((st.tasks||[]).map(t=>[t.id,t]));
    S.mine=new Map((st.basket||[]).map(b=>[b.task_id,b])); S.members=st.members||[];
    S.loaded=true; S.invalid=false; $("#status").textContent="";
  }catch(e){
    if(e.code==="28000"){ S.invalid=true; store("amkn26_token",null); S.token=null; }
    else $("#status").textContent="ei yhteyttä";
    console.error(e);
  }
  softRender();
}
async function act(fn,args,okMsg){ try{ const r=await rpc(fn,args); if(okMsg) toast(okMsg); return r; }catch(e){ toast(e.message||"Tallennus epäonnistui"); throw e; } }
async function upsertMine(task_id, patch){
  const cur = S.mine.get(task_id) || {task_id,status:"Annettu",note:"",my_dl:null};
  const row = {...cur, ...patch}; S.mine.set(task_id,row); softRender();
  try{ await act("app_set_basket",{p_task:task_id,p_status:row.status,p_note:row.note||"",p_my_dl:row.my_dl||null}); }catch(_){ loadAll(); }
}

/* ---------- render ---------- */
function render(){
  const ok = S.loaded && S.me;
  $("#nav").classList.toggle("hidden", !ok);
  $("#navAdmin").classList.toggle("hidden", !(ok && S.me.is_admin));
  $("#fab").classList.toggle("hidden", !ok || S.view==="admin");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.view===S.view));
  if(!S.token){ $("#main").innerHTML = `<div class="login"><h2>Kirjaudu</h2>
    <p>${S.invalid?"Kirjautumisesi on vanhentunut. Kirjaudu uudelleen.":"Kirjaudu ylläpitäjältä saamallasi käyttäjätunnuksella ja salasanalla. Sovellus muistaa sinut tällä laitteella."}</p>
    <form id="loginForm"><input name="u" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Käyttäjätunnus (etunimi)">
    <input name="pw" type="password" required autocomplete="current-password" placeholder="Salasana">
    <button class="btn primary" type="submit">Kirjaudu</button></form><p id="loginMsg" class="err" style="margin:10px 0 0"></p>
    <p class="muted" style="margin:12px 0 0">Jos sait henkilökohtaisen linkin, voit myös vain avata sen.</p></div>
    <div class="foot"><button data-act="privacy">Mitä tietoja tallennetaan</button></div>`; return; }
  if(!S.loaded){ $("#main").innerHTML = `<div class="empty">Ladataan…</div>`; return; }
  const v = S.view==="etusivu" ? renderHome() : S.view==="kori" ? renderKori() : S.view==="kaikki" ? renderKaikki() : renderAdmin();
  $("#main").innerHTML = v + `<div class="foot">Kirjautuneena: ${esc(S.me.first_name)}<br>
    <button data-act="profile">Oma tili</button>·<button data-act="privacy">Mitä tietoja tallennetaan</button>·<button data-act="logout">Kirjaudu ulos</button></div>`;
}
function card(task, mine, mode){
  const dl = effDl(task, mine), d = daysLeft(dl);
  const st = mine ? normStatus(mine.status, task) : null;
  const finished = mine ? isFinished(st, task) : false;
  let cls = "";
  if(!finished && d!==null) cls=urg(d);
  if(finished || (mode==="kaikki" && isPast(task))) cls+=" done";
  const whenTxt = d===null ? "" : d<0 ? `${-d} vrk sitten` : d===0 ? "tänään" : d===1 ? "huomenna" : `${d} vrk`;
  const url = safeUrl(task.moodle);
  const own = mine && mine.my_dl && mine.my_dl!==task.dl ? ` <span class="muted">(oma DL)</span>` : "";
  const by = !task.private && task.created_by_name ? `<div class="by">Lisännyt: ${esc(task.created_by_name)}</div>` : "";
  const id = esc(task.id);
  let h = `<div class="card ${cls}" id="c-${id}">
    <div class="row1"><span class="code">${esc(task.course)}</span><span class="type ${task.type==="Tentti"?"tentti":""}">${esc(task.type)}</span>${audBadge(task)}${task.private?`<span class="type priv">🔒 Oma</span>`:""}
      <span class="when">${esc(fmtDate(dl))}${own}${whenTxt?` · <b>${whenTxt}</b>`:""}</span></div>
    <div class="title">${esc(task.title || (task.type==="Tentti"?"Tentti":"(nimetön)"))}</div>
    <div class="cname">${esc(courseName(task.course))}</div>
    ${task.info?`<div class="info">${esc(task.info)}</div>`:""}`;
  if(mode==="kori"){
    h += `<div class="seg">${statusesFor(task).map(s=>`<button data-s="${s}" class="${s===st?"on":""}" data-act="status" data-id="${id}">${statusLabel(s,task)}</button>`).join("")}</div>
      <details class="more"${mine.note?" open":""}><summary>${mine.note?"Omat muistiinpanot":"+ Muistiinpanot ja oma DL"}</summary>
        <div class="mine">
          <label>Omat muistiinpanot<textarea data-act="note" data-id="${id}" rows="2" placeholder="Vain sinä näet nämä">${esc(mine.note||"")}</textarea></label>
          <label>Oma DL / tenttipäivä (jos eri kuin yhteinen)<input type="date" data-act="myDl" data-id="${id}" value="${esc(mine.my_dl||"")}"></label>
        </div></details>
      <div class="links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Moodle ↗</a>`:""}<span style="flex:1"></span>
        <button class="btn ghost" data-act="edit" data-id="${id}">Muokkaa</button>
        <button class="btn ghost" data-act="unbasket" data-id="${id}">Poista korista</button>
        <button class="btn ghost" data-act="hide" data-id="${id}">Piilota</button></div>`;
  } else {
    h += by + `<div class="links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Moodle ↗</a>`:""}<span style="flex:1"></span>
        <button class="btn ghost" data-act="edit" data-id="${id}">Muokkaa</button>
        ${mine && mine.hidden ? `<button class="btn" data-act="unhide" data-id="${id}">Palauta</button>`
          : `<button class="btn ghost" data-act="hide" data-id="${id}">Piilota minulta</button>${mine?`<button class="btn in" data-act="unbasket" data-id="${id}">✓ Korissa</button>`:`<button class="btn primary" data-act="basket" data-id="${id}">+ Koriin</button>`}`}</div>`;
  }
  return h + `</div>`;
}
const byDl = (a,b) => { const x=a||"9999", y=b||"9999"; return x<y?-1:x>y?1:0; };
function renderKori(){
  const items=[];
  for(const [id,m0] of S.mine){ const t=S.tasks.get(id); if(!t||m0.hidden) continue; const m={...m0,status:normStatus(m0.status,t)}; items.push({t,m,dl:effDl(t,m),fin:isFinished(m.status,t)}); }
  if(!items.length){
    const up=[...S.tasks.values()].filter(t=>!isPast(t)&&!S.mine.has(t.id)).length;
    return `<div class="empty"><p><b>Korisi on tyhjä.</b></p><p>Poimi tehtäviä yhteiseltä listalta, niin voit seurata niiden statusta.</p>
      ${up?`<button class="btn primary" data-act="basketAll">Lisää kaikki tulevat (${up}) koriin</button><br><br>`:""}
      <button class="btn" data-act="go" data-view="kaikki">Selaa tehtäviä</button></div>`;
  }
  const counts={aktiiviset:0}; STATUSES.forEach(s=>counts[s]=0);
  items.forEach(x=>{ counts[x.m.status]++; if(!x.fin) counts.aktiiviset++; });
  const fl=[["aktiiviset","Aktiiviset"],...STATUSES.map(s=>[s,s]),["kaikki","Kaikki"]];
  let h=`<div class="chips">${fl.map(([k,l])=>`<button class="chip ${S.f.koriStatus===k?"on":""}" data-act="koriFilter" data-k="${k}">${l}${k!=="kaikki"?`<b>${counts[k]||0}</b>`:""}</button>`).join("")}</div>`;
  let list=items.filter(x=> S.f.koriStatus==="kaikki"||(S.f.koriStatus==="aktiiviset"?!x.fin:x.m.status===S.f.koriStatus));
  list.sort((a,b)=>byDl(a.dl,b.dl)); if(S.f.koriStatus==="Palautettu") list.reverse();
  h += list.length ? list.map(x=>card(x.t,x.m,"kori")).join("") : `<div class="empty"><p>Ei tehtäviä tässä näkymässä.</p></div>`;
  return h;
}
function renderHome(){
  const rows=[];
  for(const [id,m0] of S.mine){ const t=S.tasks.get(id); if(!t||m0.hidden) continue; const st=normStatus(m0.status,t); if(isFinished(st,t)) continue; rows.push({t,st,dl:effDl(t,m0)}); }
  rows.sort((a,b)=>byDl(a.dl,b.dl));
  const notIn=[...S.tasks.values()].filter(t=>!isPast(t)&&!S.mine.has(t.id)).length;
  let h=`<div class="hhead"><b>Tulossa</b><span class="muted">${rows.length} aktiivista</span></div>`;
  if(!rows.length) h+=`<div class="empty"><p>Ei aktiivisia tehtäviä korissasi.</p><button class="btn" data-act="go" data-view="kaikki">Selaa tehtäviä</button></div>`;
  else h+=`<table class="tight"><thead><tr><th>DL</th><th>vrk</th><th>Kurssi</th><th>Aihe</th><th>Tila</th></tr></thead><tbody>${rows.map((r,i)=>{
    const d=daysLeft(r.dl), cls=d===null?"":urg(d);
    const band = d===null ? "Ei DL:ää" : d<=7 ? "7 vrk tai alle" : d<=14 ? "8–14 vrk" : "Yli 14 vrk";
    const prev = i ? (x=>x===null?"Ei DL:ää":x<=7?"7 vrk tai alle":x<=14?"8–14 vrk":"Yli 14 vrk")(daysLeft(rows[i-1].dl)) : null;
    const sep = band!==prev ? `<tr class="band"><td colspan="5">${band}</td></tr>` : "";
    const dd=r.dl?r.dl.split("-"):null;
    return sep + `<tr class="${cls}" data-act="jump" data-id="${esc(r.t.id)}"><td>${dd?`${+dd[2]}.${+dd[1]}.`:"–"}</td><td class="num">${d===null?"":d}</td>
      <td><span class="code">${esc(r.t.course)}</span></td>
      <td class="ttl">${r.t.type==="Tentti"?`<span class="tentti">Tentti</span> `:""}${esc(r.t.title||"")}</td>
      <td><span class="pill" data-s="${r.st}">${esc(statusLabel(r.st,r.t))}</span></td></tr>`;}).join("")}</tbody></table>`;
  if(notIn) h+=`<div class="notice" style="margin-top:12px"><b>${notIn} uutta tehtävää</b> käsittelemättä – lisää koriin tai piilota. <button class="btn ghost" data-act="goNew">Näytä →</button></div>`;
  return h;
}
function renderKaikki(){
  const stOf = t => { const m=S.mine.get(t.id); return !m ? "uusi" : m.hidden ? "piil" : "kori"; };
  const cnt = { uudet:[...S.tasks.values()].filter(t=>stOf(t)==="uusi"&&!isPast(t)).length, piilotetut:[...S.tasks.values()].filter(t=>stOf(t)==="piil").length };
  const used=[...new Set([...S.tasks.values()].map(t=>t.course))].sort();
  let h=`<div class="bar"><select data-act="fCourse"><option value="">Kaikki kurssit</option>${used.map(c=>`<option value="${esc(c)}" ${S.f.course===c?"selected":""}>${esc(c)} – ${esc(courseName(c))}</option>`).join("")}</select>
    <input type="search" data-act="fQ" placeholder="Hae…" value="${esc(S.f.q)}"></div>
    <div class="chips">${[["minulle","Minulle"],["uudet","Uudet"],["piilotetut","Piilotetut"],["kaikki","Kaikki"]].map(([k,l])=>`<button class="chip ${S.f.list===k?"on":""}" data-act="listF" data-k="${k}">${l}${k==="uudet"||k==="piilotetut"?`<b>${cnt[k]}</b>`:""}</button>`).join("")}
      <span style="width:8px"></span><button class="chip ${S.f.showPast?"on":""}" data-act="past" data-v="${S.f.showPast?0:1}">Myös menneet</button></div>`;
  if(!S.tasks.size) return h+`<div class="empty"><p>Listalla ei ole vielä tehtäviä.</p><button class="btn primary" data-act="new">+ Lisää ensimmäinen</button></div>`;
  const q=S.f.q.trim().toLowerCase();
  const lf={minulle:s=>s!=="piil",uudet:s=>s==="uusi",piilotetut:s=>s==="piil",kaikki:()=>true}[S.f.list];
  const list=[...S.tasks.values()].filter(t=>lf(stOf(t))&&(!S.f.course||t.course===S.f.course)&&(S.f.showPast||S.f.list==="piilotetut"||!isPast(t))&&(!q||`${t.course} ${t.title} ${t.info} ${courseName(t.course)} ${t.type}`.toLowerCase().includes(q))).sort((a,b)=>byDl(a.dl,b.dl));
  if(!list.length) return h+`<div class="empty"><p>Ei hakua vastaavia tehtäviä.</p></div>`;
  const fut=list.filter(t=>!isPast(t)), past=list.filter(isPast).reverse();
  h += fut.map(t=>card(t,S.mine.get(t.id),"kaikki")).join("");
  if(past.length) h += `<div class="group">Menneet</div>`+past.map(t=>card(t,S.mine.get(t.id),"kaikki")).join("");
  return h;
}
function linkBox(c){
  const lines=[`Opintotehtävät N26: ${BASE}`];
  if(c.username) lines.push(`Käyttäjätunnus: ${c.username}`);
  if(c.password) lines.push(`Salasana: ${c.password}`);
  if(c.tok) lines.push(`Tai suora kirjautumislinkki: ${linkFor(c.tok)}`);
  const txt=lines.join("\n");
  return `<div class="notice warn"><b>${esc(c.name)}: ${c.password&&c.tok?"tunnukset ja linkki":c.password?"uusi salasana":"uusi linkki"}</b><br>
    <span class="muted">Kopioi ja lähetä nyt suoraan henkilölle – tietoja ei näytetä uudelleen.</span>
    <textarea readonly rows="${lines.length+2}" style="margin-top:8px;font-size:13px" onclick="this.select()">${esc(txt)}</textarea>
    <button class="btn primary" data-act="copy" data-link="${esc(txt)}">Kopioi</button> <button class="btn ghost" data-act="hideLink">Valmis</button></div>`;
}

  const f=$("#taskForm");
  f.addEventListener("input",()=>{
    const c=f.course.value, ti=f.title.value.trim().toLowerCase(), ty=f.type.value, dl=f.dl.value;
    const hit=[...S.tasks.values()].find(x=>x.id!==(editing&&editing.id)&&x.course===c&&((ti&&(x.title||"").trim().toLowerCase()===ti)||(ty==="Tentti"&&x.type==="Tentti"&&dl&&x.dl===dl)));
    $("#dup").textContent = hit?`Huom: listalla on jo samanlainen tehtävä (${hit.course}: ${hit.title||hit.type}, ${fmtDate(hit.dl)}).`:"";
  });
  f.course.addEventListener("change",()=>$("#newCourse").classList.toggle("hidden",f.course.value!=="__new"));

  f.course.addEventListener("change",resetDup); f.dl.addEventListener("change",resetDup);
}
async function saveTask(f){
  const err=m=>{$("#ferr").textContent=m;};
  let course=f.course.value, newName=null; if(!course) return err("Valitse kurssi.");
  if(course==="__new"){ course=f.ncode.value.trim().toUpperCase(); newName=f.nname.value.trim(); if(!course||!newName) return err("Anna uuden kurssin lyhenne ja nimi."); }
  const moodle=f.moodle.value.trim(); if(moodle&&!safeUrl(moodle)) return err("Moodle-linkin pitää alkaa https://");
  const title=f.title.value.trim(), type=f.type.value;
  if(!title && type!=="Tentti") return err("Anna tehtävälle aihe.");
  const btn=f.querySelector("[type=submit]");
  const dl=f.dl.value;
  if(dl && !f.dataset.dupOk){
    const same=[...S.tasks.values()].filter(x=>x.id!==(editing&&editing.id)&&x.course===course&&x.dl===dl);
    if(same.length){
      $("#dup").innerHTML=`<b>Samalle kurssille samalle päivälle on jo tehtävä:</b><br>${same.map(x=>"• "+esc(x.title||x.type)).join("<br>")}<br>Onko tämä uusi tehtävä?`;
      f.dataset.dupOk="1"; btn.textContent="Kyllä, uusi tehtävä"; return;
    }
  }
  btn.disabled=true;
  try{
    await rpc("app_save_task",{p_id:editing?editing.id:null,p_course:course,p_type:type,p_title:title,p_dl:f.dl.value||null,
      p_moodle:moodle,p_info:f.info.value.trim(),p_new_course_name:newName,p_to_basket:!editing&&f.toBasket&&f.toBasket.checked,p_private:f.priv?f.priv.checked:false,p_audience:f.aud.value?f.aud.value.split(","):[]});
    toast(editing?"Tallennettu":(f.priv&&f.priv.checked?"Henkilökohtainen tehtävä lisätty":"Tehtävä lisätty kaikille")); closeSheet(); loadAll();
  }catch(e){ btn.disabled=false; err(e.message||"Tallennus epäonnistui."); }
}

/* ---------- events ---------- */
document.addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="taskForm") saveTask(f);
  else if(f.id==="profForm"){ const n=f.n.value.trim(); if(!n) return; await act("app_rename",{p_name:n},"Tallennettu"); closeSheet(); loadAll(); }
  else if(f.id==="addMember"){ const n=f.n.value.trim(), u=f.u.value.trim().toLowerCase(); if(!n||!u) return;
    const r=await act("app_create_member",{p_name:n,p_username:u}); S.newLink={name:n,username:r.username,password:r.password,tok:r.token}; loadAll(); }
  else if(f.id==="loginForm"){
    const b=f.querySelector("button"); b.disabled=true; $("#loginMsg").textContent="";
    try{ const r=await rpc("app_login",{p_username:f.u.value.trim(),p_password:f.pw.value});
      if(r&&r.ok){ S.token=r.token; store("amkn26_token",r.token); S.invalid=false; S.loaded=false; render(); loadAll(); }
      else $("#loginMsg").textContent=(r&&r.error)||"Kirjautuminen epäonnistui";
    }catch(e){ $("#loginMsg").textContent="Ei yhteyttä. Yritä hetken päästä uudelleen."; }
    b.disabled=false;
  }
  else if(f.id==="pwForm"){
    if(f.p1.value!==f.p2.value) return $("#pwErr").textContent="Salasanat eivät täsmää.";
    try{ await rpc("app_set_password",{p_new:f.p1.value}); toast("Salasana vaihdettu"); closeSheet(); loadAll(); }catch(e){ $("#pwErr").textContent=e.message||"Vaihto epäonnistui"; }
  }
  else if(f.id==="userForm"){
    try{ await rpc("app_set_username",{p_member:f.dataset.mid,p_username:f.u.value}); toast("Tunnus tallennettu"); closeSheet(); loadAll(); }catch(e){ $("#uErr").textContent=e.message||"Tallennus epäonnistui"; }
  }
});
document.addEventListener("click", async e=>{
  const nb=e.target.closest("nav button"); if(nb){ S.view=nb.dataset.view; render(); scrollTo(0,0); return; }
  if(e.target.id==="fab") return openForm();
  if(e.target.id==="sheetBg") return closeSheet();
  const b=e.target.closest("[data-act]"); if(!b||["TEXTAREA","INPUT","SELECT"].includes(b.tagName)) return;
  const id=b.dataset.id, a=b.dataset.act;
  const confirmTwice = txt => { if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent=txt; setTimeout(()=>{ if(b.isConnected) render(); },3500); return false; } return true; };
  if(a==="go"){ S.view=b.dataset.view; render(); }
  else if(a==="new") openForm();
  else if(a==="close") closeSheet();
  else if(a==="edit") openForm(id);
  else if(a==="profile") openProfile();
  else if(a==="privacy") openPrivacy();
  else if(a==="logout"){ if(!confirmTwice("Kirjaudutaanko ulos?")) return; try{ await rpc("app_logout"); }catch(_){} store("amkn26_token",null); S.token=null; S.loaded=false; S.me=null; render(); }
  else if(a==="resetPw"){ if(!confirmTwice("Vanha salasana lakkaa toimimasta – OK?")) return; const pw=await act("app_reset_password",{p_member:b.dataset.mid}); S.newLink={name:b.dataset.name,username:b.dataset.user,password:pw}; loadAll(); }
  else if(a==="editUser"){ openUsername(b.dataset.mid,b.dataset.user); }
  else if(a==="jump"){ S.view="kori"; S.f.koriStatus="aktiiviset"; render(); const c=document.getElementById("c-"+id); if(c){ c.scrollIntoView({block:"center"}); c.style.outline="2px solid var(--info)"; setTimeout(()=>c.style.outline="",1500); } }
  else if(a==="hide"){ const m=S.mine.get(id)||{task_id:id,status:"Annettu",note:"",my_dl:null}; S.mine.set(id,{...m,hidden:true}); render(); try{ await act("app_set_hidden",{p_task:id,p_hidden:true},"Piilotettu – löydät sen Piilotetut-suodattimesta"); }catch(_){ loadAll(); } }
  else if(a==="unhide"){ try{ await act("app_set_hidden",{p_task:id,p_hidden:false},"Palautettu"); }finally{ loadAll(); } }
  else if(a==="listF"){ S.f.list=b.dataset.k; render(); }
  else if(a==="goNew"){ S.view="kaikki"; S.f.list="uudet"; render(); scrollTo(0,0); }
  else if(a==="koriFilter"){ S.f.koriStatus=b.dataset.k; render(); }
  else if(a==="past"){ S.f.showPast=b.dataset.v==="1"; render(); }
  else if(a==="status"){ const m=S.mine.get(id); if(m && normStatus(m.status,S.tasks.get(id))!==b.dataset.s) upsertMine(id,{status:b.dataset.s}); }
  else if(a==="basket"){ await upsertMine(id,{status:"Annettu",hidden:false}); toast("Lisätty koriin"); }
  else if(a==="unbasket"){ if(!confirmTwice("Varmasti?")) return; S.mine.delete(id); render(); try{ await act("app_remove_basket",{p_task:id},"Poistettu korista"); }catch(_){ loadAll(); } }
  else if(a==="basketAll"){ b.disabled=true; const ids=[...S.tasks.values()].filter(t=>!isPast(t)).map(t=>t.id); await act("app_add_basket_many",{p_tasks:ids},`${ids.length} tehtävää lisätty koriin`); loadAll(); }
  else if(a==="del"){ if(!confirmTwice("Poistetaanko kaikilta?")) return; await act("app_delete_task",{p_id:editing.id},"Tehtävä poistettu"); closeSheet(); loadAll(); }
  else if(a==="reset"){ if(!confirmTwice("Vanha linkki lakkaa toimimasta – OK?")) return; const tok=await act("app_reset_link",{p_member:b.dataset.mid});
    if(b.dataset.mid===S.me.id){ S.token=tok; store("amkn26_token",tok); } S.newLink={name:b.dataset.name,tok}; render(); }
  else if(a==="rmMember"){ if(!confirmTwice("Poistetaanko jäsen ja hänen korinsa?")) return; await act("app_remove_member",{p_member:b.dataset.mid},"Jäsen poistettu"); loadAll(); }
  else if(a==="copy"){ try{ await navigator.clipboard.writeText(b.dataset.link); toast("Linkki kopioitu"); }catch(_){ toast("Kopioi linkki kentästä"); } }
  else if(a==="hideLink"){ S.newLink=null; render(); }
});
document.addEventListener("change", e=>{
  const el=e.target, a=el.dataset&&el.dataset.act; if(!a) return;
  const m=S.mine.get(el.dataset.id);
  if(a==="note" && m && (m.note||"")!==el.value) upsertMine(el.dataset.id,{note:el.value});
  else if(a==="myDl" && m && (m.my_dl||"")!==el.value) upsertMine(el.dataset.id,{my_dl:el.value||null});
  else if(a==="fCourse"){ S.f.course=el.value; render(); }
});
let qT; document.addEventListener("input", e=>{
  const fm=e.target.form; if(fm && fm.id==="addMember" && e.target.name==="n" && !fm.u.dataset.touched) fm.u.value=e.target.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._-]/g,"");
  if(fm && fm.id==="addMember" && e.target.name==="u") fm.u.dataset.touched="1";
  if(e.target.dataset && e.target.dataset.act==="fQ"){ const el=e.target; clearTimeout(qT); qT=setTimeout(()=>{ S.f.q=el.value; const p=el.selectionStart; render(); const n=$('[data-act=fQ]'); if(n){n.focus(); n.setSelectionRange(p,p);} },250); }
});
let pending=false;
function softRender(){ const a=document.activeElement; if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="search"&&!a.readOnly))&&$("#main").contains(a)){ pending=true; return; } render(); }
document.addEventListener("focusout",()=>{ if(pending){ pending=false; setTimeout(render,50); } });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.token) loadAll(); });
setInterval(()=>{ if(!document.hidden && S.token) loadAll(); }, 60000);
window.addEventListener("hashchange",()=>{ const m=location.hash.match(/k=([a-f0-9]{32,})/i); if(m){ S.token=m[1]; store("amkn26_token",S.token); history.replaceState(null,"",BASE); S.loaded=false; loadAll(); } });
loadAll();
</script>
</body>
</html>
